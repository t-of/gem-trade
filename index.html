<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060b">
  <meta name="description" content="5色のトークンで発展カードを買い、貴族を迎えて点を競うボードゲームの試作。">
  <title>gem-trade — 宝石の取引で発展する</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="gem-trade">
  <meta property="og:title" content="gem-trade — 宝石の取引で発展する">
  <meta property="og:description" content="5色のトークンで発展カードを買い、貴族を迎えて点を競うボードゲームの試作。">
  <meta property="og:url" content="https://t-of.github.io/gem-trade/">
  <meta property="og:image" content="https://t-of.github.io/gem-trade/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="gem-trade">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Shippori+Mincho&display=swap">
  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 宝石 6 種と貴族の紋章の定義。<symbol> + <use> でどこでも使い回す（main.js の gemSvg・nobleHtml）。
       色は style.css の CSS 変数（--gem-xxx-1〜3・--gold-rim-*）。preview.html で検討した形。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="grad-white" cx="35%" cy="28%" r="78%">
        <stop class="stop-white-1" offset="0%"></stop>
        <stop class="stop-white-2" offset="55%"></stop>
        <stop class="stop-white-3" offset="85%"></stop>
        <stop class="stop-white-e" offset="100%"></stop>
      </radialGradient>
      <radialGradient id="grad-blue" cx="35%" cy="28%" r="80%">
        <stop class="stop-blue-1" offset="0%"></stop>
        <stop class="stop-blue-2" offset="55%"></stop>
        <stop class="stop-blue-3" offset="85%"></stop>
        <stop class="stop-blue-e" offset="100%"></stop>
      </radialGradient>
      <radialGradient id="grad-green" cx="38%" cy="25%" r="85%">
        <stop class="stop-green-1" offset="0%"></stop>
        <stop class="stop-green-2" offset="50%"></stop>
        <stop class="stop-green-3" offset="85%"></stop>
        <stop class="stop-green-e" offset="100%"></stop>
      </radialGradient>
      <radialGradient id="grad-red" cx="35%" cy="25%" r="80%">
        <stop class="stop-red-1" offset="0%"></stop>
        <stop class="stop-red-2" offset="55%"></stop>
        <stop class="stop-red-3" offset="85%"></stop>
        <stop class="stop-red-e" offset="100%"></stop>
      </radialGradient>
      <radialGradient id="grad-black" cx="35%" cy="22%" r="85%">
        <stop class="stop-black-1" offset="0%"></stop>
        <stop class="stop-black-2" offset="45%"></stop>
        <stop class="stop-black-3" offset="85%"></stop>
        <stop class="stop-black-e" offset="100%"></stop>
      </radialGradient>
      <linearGradient id="grad-gold" x1="5%" y1="0%" x2="95%" y2="100%">
        <stop class="stop-gold-1" offset="0%"></stop>
        <stop class="stop-gold-2" offset="28%"></stop>
        <stop class="stop-gold-e" offset="52%"></stop>
        <stop class="stop-gold-1" offset="68%"></stop>
        <stop class="stop-gold-3" offset="100%"></stop>
      </linearGradient>
      <clipPath id="clip-red"><ellipse cx="50" cy="48" rx="34" ry="42"></ellipse></clipPath>
    </defs>

    <!-- 白＝ダイヤモンド（ラウンドブリリアント） -->
    <symbol id="gem-white" viewBox="0 0 100 100">
      <ellipse class="gem__shadow" cx="50" cy="92" rx="28" ry="5"></ellipse>
      <circle cx="50" cy="48" r="40" fill="url(#grad-white)"></circle>
      <polygon class="gem__facet--lt" points="50,48 50,14 68,24"></polygon>
      <polygon class="gem__facet--dk" points="50,48 68,24 78,42"></polygon>
      <polygon class="gem__facet--lt" points="50,48 78,42 72,66"></polygon>
      <polygon class="gem__facet--dk" points="50,48 72,66 50,82"></polygon>
      <polygon class="gem__facet--lt" points="50,48 50,82 28,66"></polygon>
      <polygon class="gem__facet--dk" points="50,48 28,66 22,42"></polygon>
      <polygon class="gem__facet--lt" points="50,48 22,42 32,24"></polygon>
      <polygon class="gem__facet--dk" points="50,48 32,24 50,14"></polygon>
      <circle class="gem__table" cx="50" cy="48" r="13"></circle>
      <circle class="gem__girdle" cx="50" cy="48" r="40"></circle>
      <g class="gem__fire">
        <ellipse cx="63" cy="30" rx="6" ry="2" fill="#e6a6ff" opacity=".2" transform="rotate(30 63 30)"></ellipse>
        <ellipse cx="40" cy="65" rx="6" ry="2" fill="#9be8ff" opacity=".18" transform="rotate(-20 40 65)"></ellipse>
        <ellipse cx="60" cy="63" rx="5" ry="2" fill="#fff3a0" opacity=".16" transform="rotate(50 60 63)"></ellipse>
      </g>
      <ellipse class="gem__spark" cx="38" cy="30" rx="6" ry="3" transform="rotate(-25 38 30)"></ellipse>
    </symbol>

    <!-- 青＝サファイア（クッションカット） -->
    <symbol id="gem-blue" viewBox="0 0 100 100">
      <ellipse class="gem__shadow" cx="50" cy="92" rx="30" ry="5"></ellipse>
      <rect x="14" y="12" width="72" height="72" rx="20" fill="url(#grad-blue)"></rect>
      <polygon class="gem__facet--lt" points="14,12 50,12 32,34"></polygon>
      <polygon class="gem__facet--dk" points="86,12 86,48 64,34"></polygon>
      <polygon class="gem__facet--lt" points="86,84 50,84 68,62"></polygon>
      <polygon class="gem__facet--dk" points="14,84 14,48 36,62"></polygon>
      <rect class="gem__table" x="34" y="32" width="32" height="32" rx="8"></rect>
      <rect class="gem__girdle" x="14" y="12" width="72" height="72" rx="20"></rect>
      <ellipse class="gem__spark" cx="34" cy="28" rx="7" ry="3" transform="rotate(-30 34 28)"></ellipse>
    </symbol>

    <!-- 緑＝エメラルド（エメラルドカット） -->
    <symbol id="gem-green" viewBox="0 0 100 100">
      <ellipse class="gem__shadow" cx="50" cy="94" rx="24" ry="4"></ellipse>
      <polygon points="38,10 62,10 78,22 78,78 62,90 38,90 22,78 22,22" fill="url(#grad-green)"></polygon>
      <polygon class="gem__ring gem__ring--1" points="38,10 62,10 78,22 78,78 62,90 38,90 22,78 22,22"></polygon>
      <polygon class="gem__ring gem__ring--2" points="42,20 58,20 68,28 68,72 58,80 42,80 32,72 32,28"></polygon>
      <polygon class="gem__ring gem__ring--3" points="46,30 54,30 58,34 58,66 54,70 46,70 42,66 42,34"></polygon>
      <path class="gem__cloud" d="M39,37 l9,4 M58,58 l8,4"></path>
      <polygon class="gem__girdle" points="38,10 62,10 78,22 78,78 62,90 38,90 22,78 22,22"></polygon>
      <ellipse class="gem__spark" cx="36" cy="24" rx="5" ry="2.5" transform="rotate(-20 36 24)"></ellipse>
    </symbol>

    <!-- 赤＝ルビー（オーバルカット） -->
    <symbol id="gem-red" viewBox="0 0 100 100">
      <ellipse class="gem__shadow" cx="50" cy="92" rx="26" ry="5"></ellipse>
      <ellipse cx="50" cy="48" rx="34" ry="42" fill="url(#grad-red)"></ellipse>
      <g clip-path="url(#clip-red)">
        <polygon class="gem__facet--lt" points="50,48 50,6 70,22"></polygon>
        <polygon class="gem__facet--dk" points="50,48 70,22 84,48"></polygon>
        <polygon class="gem__facet--lt" points="50,48 84,48 70,76"></polygon>
        <polygon class="gem__facet--dk" points="50,48 70,76 50,92"></polygon>
        <polygon class="gem__facet--lt" points="50,48 50,92 30,76"></polygon>
        <polygon class="gem__facet--dk" points="50,48 30,76 16,48"></polygon>
        <polygon class="gem__facet--lt" points="50,48 16,48 30,22"></polygon>
        <polygon class="gem__facet--dk" points="50,48 30,22 50,6"></polygon>
      </g>
      <ellipse class="gem__girdle" cx="50" cy="48" rx="34" ry="42"></ellipse>
      <ellipse class="gem__spark" cx="38" cy="26" rx="6" ry="3" transform="rotate(-25 38 26)"></ellipse>
    </symbol>

    <!-- 黒＝オニキス（カボション） -->
    <symbol id="gem-black" viewBox="0 0 100 100">
      <ellipse class="gem__shadow" cx="50" cy="92" rx="28" ry="5"></ellipse>
      <polygon points="50,8 86,30 86,68 50,90 14,68 14,30" fill="url(#grad-black)"></polygon>
      <polygon class="gem__girdle" points="50,8 86,30 86,68 50,90 14,68 14,30"></polygon>
      <ellipse class="gem__spark gem__spark--sharp" cx="36" cy="26" rx="8" ry="4" transform="rotate(-30 36 26)"></ellipse>
    </symbol>

    <!-- 金＝塊（ナゲット） -->
    <symbol id="gem-gold" viewBox="0 0 100 100">
      <ellipse class="gem__shadow" cx="50" cy="92" rx="30" ry="5"></ellipse>
      <path d="M24,34 Q20,18 42,14 Q62,6 78,22 Q92,34 82,52 Q90,70 68,78 Q48,94 28,78 Q10,68 16,50 Q10,40 24,34 Z" fill="url(#grad-gold)"></path>
      <path class="gem__girdle" d="M24,34 Q20,18 42,14 Q62,6 78,22 Q92,34 82,52 Q90,70 68,78 Q48,94 28,78 Q10,68 16,50 Q10,40 24,34 Z"></path>
      <path class="gem__facet--metal gem__facet--lt-line" d="M30,30 Q45,18 62,24"></path>
      <path class="gem__facet--metal gem__facet--dk-line" d="M60,60 Q72,66 78,52"></path>
      <ellipse class="gem__spark" cx="42" cy="26" rx="8" ry="3" transform="rotate(-20 42 26)"></ellipse>
    </symbol>

    <!-- 貴族の紋章。盾＋小さな王冠だけのシンプルな意匠（肖像は描かない） -->
    <symbol id="crest" viewBox="0 0 100 100">
      <path class="crest__shield" d="M50 6 L82 18 V48 C82 72 68 88 50 96 C32 88 18 72 18 48 V18 Z"></path>
      <path class="crest__crown" d="M30 22 L37 8 L44 20 L50 4 L56 20 L63 8 L70 22 L67 28 H33 Z"></path>
    </symbol>
  </svg>
  <!-- 背景の薄い飾り（結晶のシルエット）。opacity はごく薄く、prefers-reduced-motion で動きを止める -->
  <div class="bg-deco" aria-hidden="true">
    <svg class="bg-deco__gem bg-deco__gem--1" viewBox="0 0 100 100"><use href="#gem-blue"></use></svg>
    <svg class="bg-deco__gem bg-deco__gem--2" viewBox="0 0 100 100"><use href="#gem-white"></use></svg>
    <svg class="bg-deco__gem bg-deco__gem--3" viewBox="0 0 100 100"><use href="#gem-green"></use></svg>
  </div>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">gem-trade</h1>
      <div class="bar__actions">
        <button class="pill" id="go-home" hidden>ホーム</button>
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <!-- ここにゲーム本体 -->
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ ／ <a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./data.js"></script>
  <script src="./main.js"></script>
</body>
</html>
